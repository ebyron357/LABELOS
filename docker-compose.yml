services:
  labelos-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      LABELOS_API_TOKEN: ${LABELOS_API_TOKEN}
      LABELOS_STORAGE_PATH: /data/storage
      LABELOS_LOG_LEVEL: INFO
    volumes:
      - labelos-storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  labelos-storage:
