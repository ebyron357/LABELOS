# Render Blueprint for LABELOS API
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → select ebyron357/LABELOS
# (branch main, which contains the canonical validated release engine).
# Set LABELOS_API_TOKEN in the dashboard when prompted (sync: false).
# Persistent disk keeps releases/jobs across deploys (requires paid plan).

services:
  - type: web
    name: labelos-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip setuptools wheel && pip install .
    startCommand: labelos-api
    healthCheckPath: /health
    envVars:
      - key: LABELOS_API_TOKEN
        sync: false
      - key: LABELOS_STORAGE_PATH
        value: /var/data/storage
      - key: LABELOS_API_HOST
        value: 0.0.0.0
      # Do not set LABELOS_API_PORT. Bind to Render-injected PORT (default 10000).
      - key: LABELOS_LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.8"
    disk:
      name: labelos-storage
      mountPath: /var/data
      sizeGB: 10
