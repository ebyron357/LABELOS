[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelos"
version = "0.2.0"
description = "Production label artwork validation and release packaging"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "LABELOS"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "Pillow>=12.3.0",
  "PyMuPDF>=1.28.2",
  "zxing-cpp>=3.1.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
]

[project.optional-dependencies]
test = [
  "python-barcode>=0.16.1",
  "pytest>=9.1.1",
  "qrcode>=8.2",
  "httpx>=0.27.0",
]
dev = [
  "build>=1.5.0",
  "ruff>=0.16.2",
]
bridge = [
  "pywin32>=308; platform_system=='Windows'",
]

[project.scripts]
labelos = "labelos.cli:main"
labelos-api = "labelos.api:main"
labelos-bridge = "illustrator_bridge.server:main"

[tool.setuptools]
packages = ["labelos", "labelos.schemas", "illustrator_bridge", "illustrator_bridge.scripts"]

[tool.setuptools.package-data]
illustrator_bridge = ["scripts/*.jsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["vendor", "production", "scripts"]
