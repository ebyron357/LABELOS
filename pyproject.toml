[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelos"
version = "0.1.0"
description = "Auditable production-readiness checks and packaging for print labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LABELOS" }]
dependencies = [
  "Pillow>=11.0.0",
  "PyMuPDF>=1.26.0",
  "zxing-cpp>=2.3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "qrcode[pil]>=8.0",
  "python-barcode>=0.16.0",
]

[project.scripts]
labelos = "labelos.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
