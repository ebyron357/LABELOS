[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelos"
version = "0.1.0"
description = "Production label artwork validation and release packaging"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "LABELOS"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "PyMuPDF>=1.28.2",
  "zxing-cpp>=3.1.1",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "qrcode>=8.2",
]
dev = [
  "build>=1.5.0",
  "ruff>=0.16.2",
]

[project.scripts]
labelos = "labelos.cli:main"

[tool.setuptools]
packages = ["labelos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
