name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m build
      - name: Verify committed operator fixtures
        run: |
          python -m labelos.cli validate examples/fixture-pass.json --json
          ! python -m labelos.cli validate examples/fixture-fail-safe-area.json --json
          ! python -m labelos.cli validate examples/fixture-fail-dimensions.json --json
          ! python -m labelos.cli validate examples/fixture-fail-missing-copy.json --json
