name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m build
      - run: python -m labelos.cli validate examples/label.json --json
      - run: python -m labelos.cli package examples/label.json /tmp/labelos-e2e --json
      - run: python -m labelos.cli verify-package /tmp/labelos-e2e --json
      - run: python -m labelos.cli doctor --json
